date.timezone = Europe/Bratislava
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
; DEVELOPMENT ONLY — never deploy this ini to production.
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
; Include runtime errors in docker compose logs (stderr).
error_log = /proc/self/fd/2
opcache.enable = 1
opcache.validate_timestamps = 1
