
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Docker, PHPStan, Tester, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      POSTGRES_DB: maringotka_ci
      POSTGRES_USER: maringotka_ci
      POSTGRES_PASSWORD: ci-only-temporary-password
      HTTP_PORT: '8080'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require committed Composer lockfile
        run: |
          test -f composer.lock || {
            echo 'composer.lock is missing.' >&2
            exit 1
          }

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start the development stack
        run: docker compose up --build -d --wait

      - name: Install locked Composer dependencies
        run: |
          docker compose exec -T php composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Run static analysis and tests
        run: docker compose exec -T php composer check

      - name: Smoke test Nette and PostgreSQL
        run: docker compose exec -T php php bin/check-app.php

      - name: Apply database migrations
        run: docker compose exec -T php php bin/migrate.php

      - name: Prepare PHP-FPM runtime permissions
        run: |
          docker compose exec -T php sh -ec '
            mkdir -p var/temp var/log var/monitoring
            chown -R www-data:www-data var/temp var/log var/monitoring
            chmod -R u+rwX var/temp var/log var/monitoring
          '

      - name: Smoke test HTTP homepage
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8080/ > /dev/null

      - name: Show application logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker compose ps

          echo "=== PHP logs ==="
          docker compose logs --no-color --tail=100 php

          echo "=== Nginx logs ==="
          docker compose logs --no-color --tail=100 web

          echo "=== Tracy log locations ==="
          docker compose exec -T php sh -c '
            find /var/www/html/var \
              -type f \
              \( -name "*.log" -o -name "exception*.html" \) \
              -print 2>/dev/null || true
          '

          echo "=== Tracy error messages ==="
          docker compose exec -T php sh -c '
            find /var/www/html/var \
              -type f -name "*.log" \
              -exec grep -h -m 5 \
              -E "Exception|Error|Fatal|Warning" {} \; \
              2>/dev/null || true
          '

      - name: Inspect Tracy configuration
        if: failure()
        run: |
          docker compose exec -T php sh -c '
            echo "=== Tracy directory ==="
            ls -ld /var/www/html/var/log 2>&1 || true

            echo "=== PHP-FPM processes ==="
            ps 2>&1 || true

            echo "=== Log files ==="
            find /var/www/html/var/log -maxdepth 1 \
              -type f -print 2>/dev/null || true

            echo "=== Writable check ==="
            if [ -w /var/www/html/var/log ]; then
              echo "Writable by current CLI user"
            else
              echo "Not writable by current CLI user"
            fi
          '

      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
