name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Docker, PHPStan, Tester, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: maringotka_ci
      POSTGRES_USER: maringotka_ci
      POSTGRES_PASSWORD: ci-only-temporary-password
      HTTP_PORT: '8080'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require committed Composer lockfile
        run: |
          test -f composer.lock || { echo 'composer.lock is missing. Commit the locally generated lockfile.' >&2; exit 1; }

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start the development stack
        run: docker compose up --build -d --wait

      - name: Install locked Composer dependencies
        run: docker compose exec -T php composer install --no-interaction --prefer-dist --no-progress

      - name: Run static analysis and tests
        run: docker compose exec -T php composer check

      - name: Smoke test Nette and PostgreSQL
        run: docker compose exec -T php php bin/check-app.php

      - name: Smoke test HTTP homepage
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8080/ > /dev/null

      - name: Show application logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker compose ps

          echo "=== PHP logs ==="
          docker compose logs --no-color --tail=100 php

          echo "=== Nginx logs ==="
          docker compose logs --no-color --tail=100 web

          echo "=== Tracy logs ==="
          docker compose exec -T php sh -c '
            find var -type f -name "*.log" \
              -exec tail -n 50 {} \; 2>/dev/null
          '
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120

      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
